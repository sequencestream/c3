# Release workflow (release 6/7) — GH Actions native matrix for the c3 release pipeline.
#
# Why a separate workflow: bytecodes + macOS ad-hoc codesign only pay off when each target
# is built on its NATIVE OS runner. Cross-compile + bytecode segfaults (oven-sh/bun#18416);
# macOS ad-hoc needs a darwin host.
#
# Per-target build jobs: because cross-compile is banned, every target builds on its own
# native OS runner. Each target job runs build → smoke → checksum → verify(postgate), then
# uploads its checksummed artifacts (actions/upload-artifact). A final `publish` job gathers all
# targets and cuts ONE public GitHub Release. The `needs:` chain enforces the gate order: a
# red pregate skips every target; within a target a failed build/smoke/checksum/verify aborts it.
#
# Consequences of the per-target design (intentional):
#   - Each target carries its OWN single-target manifest.json + sidecars on the build
#     runner. The `publish` job downloads them WITHOUT merge-multiple (same-named
#     manifest.json / SHA256SUMS would silently overwrite each other), then runs
#     `scripts/release/merge-dist.mjs` to fold the per-target manifests into ONE
#     cross-target manifest.json + SHA256SUMS — the desktop updater reads exactly that
#     `releases/download/<tag>/manifest.json` to pick its platform's `channel: desktop`
#     artifact. Consumers cross-check a download with its own .sha256.
#
# Distribution: the `publish` job downloads every target's artifacts, merges + postgates
# the combined set (schema / version / commit consistency, manifest ↔ SHA256SUMS ↔ on-disk
# hashes, P0 completeness, no orphan packages), then creates a public GitHub Release
# (`gh release create`) whose asset set includes every package + its .sha256 sidecar +
# SHA256SUMS + the merged manifest.json. Notes are auto-generated from the merged-PR /
# commit history since the last release (`--generate-notes`, categorized by .github/release.yml).
# Integrity is the sha256 sidecars + GitHub HTTPS (open-source builds carry no code signature).
#
# Targets are fixed (linux-x64, macos-arm64, windows-x64): every run builds all of them,
# there is no target-subset input. A `setup` job resolves only the `version` input
# (optional, e.g. v0.1.0 → C3_RELEASE_VERSION) and the shared batch subdirectory.
#
# Two CHANNELS ship from the same run and the same version:
#   - `build-publish-<target>`  — the CLI single binary (`c3-v{ver}-{target}.tar.gz|zip`)
#   - `build-desktop-<target>`  — the Tauri desktop app (`c3-desktop-v{ver}-{target}.{dmg|…}`),
#     which embeds THAT SAME binary as its sidecar. Consumers pick one; both carry
#     sha256 sidecars and a `channel` field in their manifest entry.
# The CLI channel gates the release; a red desktop job drops only its own artifact.
#
# Trigger: workflow_dispatch (manual release entry; runs the full chain).
#          push tags: v* (re-build + re-publish for the pushed tag).
#
# Local `pnpm release` still works — this workflow calls the same node scripts
# (release:build, release:smoke, checksum, postgate) so local and CI share one source of truth.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v0.1.0 (overrides git-describe). Empty = derive from the git tag.'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read # checkout only — no git tag / gh release in this workflow

jobs:
  # ────────────────────────────────────────────────────────────────────
  # -1. setup — resolve the version + batch ONCE so every per-target job shares one
  #     source of truth. `version` is the optional explicit release version
  #     (C3_RELEASE_VERSION). Every dispatch/tag run builds all targets and publishes.
  # ────────────────────────────────────────────────────────────────────
  setup:
    name: 'setup (resolve version + batch)'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      batch: ${{ steps.resolve.outputs.batch }}
    steps:
      - name: Resolve version + batch
        id: resolve
        shell: bash
        run: |
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

          # Shared time subdirectory for the whole release (UTC, path-safe charset).
          batch="$(date -u +%Y%m%d-%H%MZ)"
          echo "batch=$batch" >> "$GITHUB_OUTPUT"

          echo "[setup] version='${{ inputs.version }}' batch=$batch"

  # ────────────────────────────────────────────────────────────────────
  # 0. pregate (source-level blocking gate; release 5/7)
  #    typecheck → lint → test → i18n:check
  #    Red here = NO compile attempted (cross-compile is the most expensive stage).
  # ────────────────────────────────────────────────────────────────────
  pregate:
    name: 'pregate (typecheck → lint → test → i18n:check)'
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: i18n check
        run: pnpm i18n:check

  # ────────────────────────────────────────────────────────────────────
  # 1. build-publish-<target> (one self-contained job per target)
  #    build → smoke → checksum → verify(postgate) → upload-artifact (for the publish job).
  #    Each runs on the target's NATIVE OS. All targets build on every run.
  # ────────────────────────────────────────────────────────────────────
  build-publish-linux-x64:
    name: 'build+publish linux-x64'
    needs: [pregate, setup]
    runs-on: ubuntu-latest
    environment: default
    timeout-minutes: 40
    env:
      BUN_INSTALL: ${{ github.workspace }}/.bun
      C3_RELEASE_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash
        shell: bash

      - name: Install dependencies
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          pnpm install --frozen-lockfile

      - name: Build linux-x64
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          pnpm release:build --targets=linux-x64 --skip-smoke --strict

      - name: Smoke (--version + headless)
        run: |
          pkg=$(ls dist/c3-v*-linux-x64.tar.gz | head -1)
          mkdir -p dist/smoke
          tar -xzf "$pkg" -C dist/smoke
          node scripts/release/smoke.mjs --file=dist/smoke/c3 --timeout=20000

      - name: Checksum artifacts
        run: node scripts/release/checksum.mjs --manifest=dist/manifest.json

      - name: Verify distribution consistency
        env:
          C3_REQUIRED_TARGETS: linux-x64
        run: node scripts/release/postgate.mjs --manifest=dist/manifest.json

      - name: Upload checksummed artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: c3-linux-x64
          path: |
            dist/c3-v*-linux-x64.tar.gz
            dist/c3-v*-linux-x64.zip
            dist/manifest.json
            dist/*.sha256
            dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 7

  build-publish-macos-arm64:
    name: 'build+publish macos-arm64'
    needs: [pregate, setup]
    runs-on: macos-14
    environment: default
    timeout-minutes: 40
    env:
      BUN_INSTALL: ${{ github.workspace }}/.bun
      C3_RELEASE_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash
        shell: bash

      - name: Install dependencies
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          pnpm install --frozen-lockfile

      - name: Build macos-arm64
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          pnpm release:build --targets=macos-arm64 --skip-smoke --strict

      - name: Smoke (--version + headless)
        run: |
          pkg=$(ls dist/c3-v*-macos-arm64.tar.gz | head -1)
          mkdir -p dist/smoke
          tar -xzf "$pkg" -C dist/smoke
          node scripts/release/smoke.mjs --file=dist/smoke/c3 --timeout=20000

      - name: Checksum artifacts
        run: node scripts/release/checksum.mjs --manifest=dist/manifest.json

      - name: Verify distribution consistency
        env:
          C3_REQUIRED_TARGETS: macos-arm64
        run: node scripts/release/postgate.mjs --manifest=dist/manifest.json

      - name: Upload checksummed artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: c3-macos-arm64
          path: |
            dist/c3-v*-macos-arm64.tar.gz
            dist/c3-v*-macos-arm64.zip
            dist/manifest.json
            dist/*.sha256
            dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 7

  build-publish-windows-x64:
    name: 'build+publish windows-x64 (⚠️ experimental)'
    needs: [pregate, setup]
    runs-on: windows-latest
    environment: default
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      BUN_INSTALL: ${{ github.workspace }}\.bun
      C3_RELEASE_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Bun
        run: irm bun.sh/install.ps1 | iex

      - name: Install dependencies
        run: |
          $env:PATH = "$env:BUN_INSTALL/bin;$env:PATH"
          pnpm install --frozen-lockfile

      # `--strict`: this job exists solely to produce windows-x64, so the
      # experimental best-effort drop must not apply — a dropped target here would
      # surface as a missing-artifact glob three steps later instead of the real cause.
      - name: Build windows-x64
        run: |
          $env:PATH = "$env:BUN_INSTALL/bin;$env:PATH"
          pnpm release:build --targets=windows-x64 --skip-smoke --strict

      - name: Smoke (--version + headless)
        run: |
          $pkg = Get-ChildItem dist/c3-v*-windows-x64.zip | Select-Object -First 1
          if (-not $pkg) {
            Write-Error "no dist/c3-v*-windows-x64.zip — the build step produced no package. See the Build step's log."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path dist/smoke | Out-Null
          Expand-Archive -Path $pkg.FullName -DestinationPath dist/smoke -Force
          node scripts/release/smoke.mjs --file=dist/smoke/c3.exe --timeout=20000

      - name: Checksum artifacts
        run: node scripts/release/checksum.mjs --manifest=dist/manifest.json

      - name: Verify distribution consistency
        env:
          C3_REQUIRED_TARGETS: windows-x64
        run: node scripts/release/postgate.mjs --manifest=dist/manifest.json

      - name: Upload checksummed artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: c3-windows-x64
          path: |
            dist/c3-v*-windows-x64.tar.gz
            dist/c3-v*-windows-x64.zip
            dist/manifest.json
            dist/*.sha256
            dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────
  # 1b. build-desktop-<target> — the DESKTOP channel (Tauri 2 shell wrapping the
  #     same c3 single binary as a sidecar). One job per platform on its NATIVE
  #     runner: Tauri has no cross-platform bundling, and macOS signing +
  #     notarization only work on a darwin host.
  #
  #     Each job runs `pnpm release:desktop` (web → static-embed → sidecar compile
  #     via the SAME build-target.mjs primitive → stage → tauri build → collect),
  #     then checksum + postgate scoped to `C3_REQUIRED_CHANNEL=desktop`.
  #
  #     A desktop failure blocks ONLY that desktop artifact — see the `publish`
  #     job's `if:` guard, which requires the three CLI jobs but tolerates a red
  #     desktop job. That mirrors the spec: a signing/bundling/checksum failure
  #     blocks the corresponding desktop target's release, not the CLI cut.
  # ────────────────────────────────────────────────────────────────────
  build-desktop-macos-arm64:
    name: 'build desktop macos-arm64 (ad-hoc, Developer ID when configured)'
    needs: [pregate, setup]
    runs-on: macos-14
    environment: default
    timeout-minutes: 60
    env:
      BUN_INSTALL: ${{ github.workspace }}/.bun
      C3_RELEASE_VERSION: ${{ needs.setup.outputs.version }}
      # Developer ID signing + notarization, when the secrets are configured. An
      # UNSET secret renders as an EMPTY STRING here while the env var still
      # exists, and the Tauri bundler only checks for existence — so it used to
      # run `security import` on empty bytes and fail the whole build. The build
      # script (macSigningMode) rejects empty values and strips these vars before
      # invoking Tauri, falling back to an ad-hoc signature. `--require-signing`
      # (below) then gates against whichever tier actually applies: ad-hoc must at
      # minimum verify; Developer ID must additionally be notarized.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-macos-arm64-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-macos-arm64-

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash
        shell: bash

      - name: Install dependencies
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          pnpm install --frozen-lockfile

      - name: Build desktop macos-arm64
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          pnpm release:desktop --targets=macos-arm64 --require-signing

      - name: Report signing status
        run: |
          if [ -z "${APPLE_CERTIFICATE// }" ]; then
            echo "::warning::No Developer ID certificate configured — the macOS desktop bundles are AD-HOC signed and NOT notarized. Gatekeeper will quarantine them; the release notes must tell users to run 'xattr -dr com.apple.quarantine /Applications/c3.app'."
          else
            echo "[desktop] Developer ID certificate present — bundles signed by the Tauri bundler."
          fi

      - name: Checksum artifacts
        run: node scripts/release/checksum.mjs --manifest=dist/manifest.json

      - name: Verify distribution consistency
        env:
          C3_REQUIRED_TARGETS: macos-arm64
          C3_REQUIRED_CHANNEL: desktop
        run: node scripts/release/postgate.mjs --manifest=dist/manifest.json

      - name: Upload desktop artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: c3-desktop-macos-arm64
          path: |
            dist/c3-desktop-v*-macos-arm64.*
            dist/manifest.json
            dist/*.sha256
            dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 7

  build-desktop-windows-x64:
    name: 'build desktop windows-x64'
    needs: [pregate, setup]
    runs-on: windows-latest
    environment: default
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      BUN_INSTALL: ${{ github.workspace }}\.bun
      C3_RELEASE_VERSION: ${{ needs.setup.outputs.version }}
      # Authenticode signing when a certificate is configured. Absent credentials
      # do NOT fail the build — the artifacts ship unsigned and the release notes
      # must state the SmartScreen warning (see doc/non-functional/release.md).
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-windows-x64-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-x64-

      - name: Install Bun
        run: irm bun.sh/install.ps1 | iex

      - name: Install dependencies
        run: |
          $env:PATH = "$env:BUN_INSTALL/bin;$env:PATH"
          pnpm install --frozen-lockfile

      - name: Build desktop windows-x64
        run: |
          $env:PATH = "$env:BUN_INSTALL/bin;$env:PATH"
          pnpm release:desktop --targets=windows-x64

      - name: Report signing status
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "::warning::No Authenticode certificate configured — the Windows desktop installers are UNSIGNED and will show a SmartScreen warning. The release notes must say so."
          } else {
            Write-Host "[desktop] Authenticode certificate present — installers signed by the Tauri bundler."
          }

      - name: Checksum artifacts
        run: node scripts/release/checksum.mjs --manifest=dist/manifest.json

      - name: Verify distribution consistency
        env:
          C3_REQUIRED_TARGETS: windows-x64
          C3_REQUIRED_CHANNEL: desktop
        run: node scripts/release/postgate.mjs --manifest=dist/manifest.json

      - name: Upload desktop artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: c3-desktop-windows-x64
          path: |
            dist/c3-desktop-v*-windows-x64.*
            dist/manifest.json
            dist/*.sha256
            dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 7

  build-desktop-linux-x64:
    name: 'build desktop linux-x64'
    needs: [pregate, setup]
    runs-on: ubuntu-latest
    environment: default
    timeout-minutes: 60
    env:
      BUN_INSTALL: ${{ github.workspace }}/.bun
      C3_RELEASE_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tauri on Linux links against the system WebKitGTK; the bundler additionally
      # needs librsvg (icons) and libxdo (tray). Installed explicitly, then VERIFIED —
      # a missing dev package otherwise surfaces as an opaque linker error much later.
      - name: Install WebKitGTK / Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf

      - name: Verify WebKitGTK is present
        run: |
          set -e
          for pkg in webkit2gtk-4.1 gtk+-3.0 librsvg-2.0; do
            version="$(pkg-config --modversion "$pkg")"
            echo "[desktop] $pkg $version"
          done

      # Ubuntu 24.04 起用 AppArmor 限制非特权 user namespace,而 AppImage 打包链路
      # (linuxdeploy 及其插件)本身就是 AppImage,会被拦在启动阶段,失败时不留输出。
      # 打包侧已用 APPIMAGE_EXTRACT_AND_RUN 绕开自挂载,这里放开限制作为第二道保险。
      # 该 sysctl 键不存在的镜像上跳过 —— 那种镜像本就没有这条限制。
      - name: Allow unprivileged user namespaces (AppImage tooling)
        run: |
          set -e
          key=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$key" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "[desktop] $key absent — no AppArmor userns restriction to relax"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (x86_64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-linux-x64-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-linux-x64-

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash
        shell: bash

      - name: Install dependencies
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          pnpm install --frozen-lockfile

      - name: Build desktop linux-x64
        run: |
          export PATH="$BUN_INSTALL/bin:$PATH"
          pnpm release:desktop --targets=linux-x64

      - name: Checksum artifacts
        run: node scripts/release/checksum.mjs --manifest=dist/manifest.json

      - name: Verify distribution consistency
        env:
          C3_REQUIRED_TARGETS: linux-x64
          C3_REQUIRED_CHANNEL: desktop
        run: node scripts/release/postgate.mjs --manifest=dist/manifest.json

      - name: Upload desktop artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: c3-desktop-linux-x64
          path: |
            dist/c3-desktop-v*-linux-x64.*
            dist/manifest.json
            dist/*.sha256
            dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────
  # 2. publish — download every target's checksummed artifacts, MERGE them into one
  #    cross-target manifest.json + SHA256SUMS (merge-dist), run the publish-level
  #    postgate over the combined set, then cut ONE public GitHub Release whose asset
  #    set includes every package + its .sha256 sidecar + SHA256SUMS + the merged
  #    manifest.json. Release notes are auto-generated from the merged-PR /
  #    commit history since the previous release (GitHub `--generate-notes`,
  #    categorized by .github/release.yml). Needs `contents: write` to create the
  #    Release + tag.
  #
  #    The CLI channel is the release gate: `if:` demands all three CLI jobs be
  #    green. Desktop jobs are in `needs` so publish WAITS for them, but a red
  #    desktop job only removes that desktop artifact from the release — it must
  #    not hold the CLI single binary hostage. A failed desktop job's target is
  #    absent from the merged manifest by construction.
  # ────────────────────────────────────────────────────────────────────
  publish:
    name: 'publish (GitHub Release + auto notes)'
    needs:
      [
        setup,
        build-publish-linux-x64,
        build-publish-macos-arm64,
        build-publish-windows-x64,
        build-desktop-macos-arm64,
        build-desktop-windows-x64,
        build-desktop-linux-x64,
      ]
    if: >-
      ${{ !cancelled()
      && needs.build-publish-linux-x64.result == 'success'
      && needs.build-publish-macos-arm64.result == 'success'
      && needs.build-publish-windows-x64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release + tag and upload assets
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so --generate-notes can diff against the last release

      # Downloaded WITHOUT merge-multiple: each artifact keeps its own subdir
      # (`release-dist/<artifact-name>/…`). merge-multiple would flatten the
      # same-named per-target `manifest.json` / `SHA256SUMS` on top of each other
      # and only the last one would survive — the merge step below needs them all.
      - name: Download all target artifacts (per-artifact subdirs)
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          pattern: c3-*

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          tag="${{ needs.setup.outputs.version }}"
          if [ -z "$tag" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          fi
          if [ -z "$tag" ]; then
            echo "::error::no release version resolved (pass the 'version' input or push a v* tag)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "[publish] release tag: $tag"

      # Fold the per-target dists into ONE flat dist. merge-dist asserts every
      # input manifest shares schema/version/commit, dedups by filename (two
      # different hashes for the same file = abort), flattens every package +
      # .sha256 sidecar up into release-dist/, and writes the merged manifest.json
      # + SHA256SUMS. A failed/absent desktop job simply has no subdir to merge —
      # only the successful targets end up in the merged manifest.
      - name: Merge per-target dists (manifest + packages + sidecars + SHA256SUMS)
        shell: bash
        run: node scripts/release/merge-dist.mjs --dist=release-dist

      # Publish-level postgate (release 5/7): merged manifest ↔ SHA256SUMS ↔ on-disk
      # sha256, every P0 CLI target present, schema is c3-release-manifest/*, and no
      # business artifact sits in release-dist without the manifest describing it.
      # The three CLI jobs are already the hard gate (the `if:` above); the three
      # targets are passed so the merged set is held to them. A red merge or gate
      # aborts the job BEFORE any `gh` call — no partial release.
      - name: Verify the merged distribution (postgate)
        env:
          C3_REQUIRED_TARGETS: linux-x64,macos-arm64,windows-x64
        shell: bash
        run: node scripts/release/postgate.mjs --manifest=release-dist/manifest.json

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # Drop the per-target subdirs: the flat merged release-dist/ IS the upload
          # set (every package + its .sha256 sidecar + SHA256SUMS + the merged
          # manifest.json). The subdirs were consumed by merge-dist; uploads must
          # not include them.
          find release-dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          shopt -s nullglob
          assets=(release-dist/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no artifacts — nothing to publish."
            exit 1
          fi
          # Gate: the desktop updater resolves the release via
          # `releases/download/<tag>/manifest.json` — an upload set without it is a
          # silent 404 for every client, so refuse to create/update such a Release.
          if [[ " ${assets[*]} " != *" release-dist/manifest.json "* ]]; then
            echo "::error::upload set missing release-dist/manifest.json."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[publish] release $tag exists — uploading assets (clobber)."
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "[publish] creating release $tag with auto-generated notes."
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes
          fi
